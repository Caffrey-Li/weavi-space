# 阿里云 ECS 上的 Nginx 反向代理示例：复制到 /etc/nginx/conf.d/weavi-space.conf，改好域名和证书路径后
#   sudo nginx -t && sudo systemctl reload nginx
# 应用监听 127.0.0.1:3000（安全组只放行 80 / 443，不要对外开 3000 和 5432）。
# 应用的 .env 里要配：APP_URL=https://<域名>、TRUST_PROXY=1，COOKIE_SECURE 保持默认（开启）。

server {
  listen 80;
  server_name collab.example.com;
  return 301 https://$host$request_uri;
}

server {
  # Ubuntu 24.04 自带 Nginx 1.24，用 listen … http2 的写法（1.25 以后可改成单独一行 http2 on;）
  listen 443 ssl http2;
  server_name collab.example.com;

  # 阿里云「数字证书管理服务」下载的 Nginx 格式证书
  ssl_certificate     /etc/nginx/ssl/collab.example.com.pem;
  ssl_certificate_key /etc/nginx/ssl/collab.example.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # 附件、架构图上传（应用内单个文件上限 5 MB），留一点余量
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # AI 对话、个人能力等等模型回复可能要几十秒
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
